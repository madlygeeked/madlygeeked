name: lastfm
on:
  schedule: [{ cron: "*/15 * * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 lastfm/render.py
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USER: madgeeked
      - run: |
          git config user.name "madgeeked-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lastfm.svg
          git diff --cached --quiet || (git commit -m "lastfm" && git push)
